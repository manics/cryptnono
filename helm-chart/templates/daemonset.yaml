{{- $collector_metrics_enabled := and .Values.metrics.collector.enabled .Values.metrics.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "cryptnono.fullname" . }}
  labels:
    {{- include "cryptnono.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "cryptnono.selectorLabels" . | nindent 6 }}

  template:
    metadata:
      annotations:
        checksum/config-execwhacker: {{ include (print $.Template.BasePath "/configmap-execwhacker.yaml") . | sha256sum }}
        checksum/config-tcpflowkiller: {{ include (print $.Template.BasePath "/configmap-tcpflowkiller.yaml") . | sha256sum }}
        checksum/config-collector: {{ include (print $.Template.BasePath "/configmap-collector.yaml") . | sha256sum }}
        {{- if and $collector_metrics_enabled .Values.metrics.collector.prometheusScrapeAnnotation }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.metrics.collector.port }}"
        prometheus.io/path: "/metrics"
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- . | toYaml | nindent 8 }}
        {{- end }}
      labels:
        {{- include "cryptnono.selectorLabels" . | nindent 10 }}
    spec:
      containers:
        {{- if .Values.detectors.execwhacker.enabled }}
        - name: execwhacker
          args:
            - /scripts/execwhacker.py
            {{- if or .Values.detectors.execwhacker.containerdHostPath .Values.detectors.execwhacker.dockerHostPath }}
            - --lookup-container
            {{- end }}
            {{- range $key, $value := .Values.detectors.execwhacker.configs }}
            - --config
            - /config/execwhacker-{{ $key }}.json
            {{ end }}
            {{- range .Values.detectors.execwhacker.lookupEnvs }}
            - --lookup-container-env
            - {{ . }}
            {{ end }}
            {{- if .Values.detectors.execwhacker.debug }}
            - --debug
            {{ end}}
            {{- if .Values.metrics.enabled }}
            - --serve-metrics-port={{ .Values.detectors.execwhacker.metrics.port }}
            {{ end}}
            - --threadpool-size={{ .Values.detectors.execwhacker.threadpoolSize }}
          {{- if or .Values.detectors.execwhacker.containerdHostPath .Values.detectors.execwhacker.dockerHostPath .Values.detectors.execwhacker.env }}
          env:
            {{- with .Values.detectors.execwhacker.containerdHostPath }}
            - name: CONTAINER_RUNTIME_ENDPOINT
              value: unix:///host{{ . }}
            {{- end }}
            {{- with .Values.detectors.execwhacker.dockerHostPath }}
            - name: DOCKER_HOST
              value: unix:///host{{ . }}
            {{- end }}
            {{- range $key, $value := .Values.detectors.execwhacker.env }}
            - name: {{ $key }}
              value: {{ $value }}
            {{- end }}
          {{- end }}
          {{- with .Values.image }}
          image: "{{ .repository }}:{{ .tag }}"
          {{- end }}
          {{- with .Values.image.pullPolicy }}
          imagePullPolicy: {{ . }}
          {{- end }}
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- . | toYaml | nindent 12 }}
          {{- end }}
          {{- if and .Values.metrics.enabled (not $collector_metrics_enabled) }}
          ports:
            - containerPort: {{ .Values.detectors.execwhacker.metrics.port }}
              protocol: TCP
          {{ end }}
          {{- with .Values.detectors.execwhacker.resources }}
          resources:
            {{- . | toYaml | nindent 12 }}
          {{- end }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- . | toYaml | nindent 12 }}
          {{- end }}
          stdin: true
          tty: true
          volumeMounts:
            - mountPath: /sys
              name: sys
              readOnly: true
            - mountPath: /config
              name: config-execwhacker
              readOnly: true
            {{- if or .Values.detectors.execwhacker.containerdHostPath .Values.detectors.execwhacker.dockerHostPath }}
            - mountPath: /host
              name: host-rootfs
              readOnly: true
            {{- end }}
        {{ end }}
        {{- if .Values.detectors.monero.enabled }}
        - name: monero
          args:
            - /scripts/monero.py
          {{- with .Values.image }}
          image: "{{ .repository }}:{{ .tag }}"
          {{- end }}
          {{- with .Values.image.pullPolicy }}
          imagePullPolicy: {{ . }}
          {{- end }}
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- . | toYaml | nindent 12 }}
          {{- end }}
          {{- with .Values.detectors.monero.resources }}
          resources:
            {{- . | toYaml | nindent 12 }}
          {{- end }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- . | toYaml | nindent 12 }}
          {{- end }}
          stdin: true
          tty: true
          volumeMounts:
            - mountPath: /sys
              name: sys
              readOnly: true
        {{- end }}
        {{- if and .Values.detectors.tcpflowkiller.enabled }}
        - name: flowkiller
          args:
            - /scripts/flowkiller.py
            - --config=/config/flowkiller_config.json
            {{- if .Values.metrics.enabled }}
            - --FlowKiller.metrics_port={{ .Values.detectors.tcpflowkiller.metrics.port }}
            {{- end }}
          {{- if or .Values.detectors.tcpflowkiller.containerdHostPath .Values.detectors.tcpflowkiller.dockerHostPath .Values.detectors.tcpflowkiller.env }}
          env:
            {{- with .Values.detectors.tcpflowkiller.containerdHostPath }}
            - name: CONTAINER_RUNTIME_ENDPOINT
              value: unix:///host{{ . }}
            {{- end }}
            {{- with .Values.detectors.tcpflowkiller.dockerHostPath }}
            - name: DOCKER_HOST
              value: unix:///host{{ . }}
            {{- end }}
          {{- end }}
          {{- with .Values.image }}
          image: "{{ .repository }}:{{ .tag }}"
          {{- end }}
          {{- with .Values.image.pullPolicy }}
          imagePullPolicy: {{ . }}
          {{- end }}
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- . | toYaml | nindent 12 }}
          {{- end }}
          {{- if and .Values.metrics.enabled (not $collector_metrics_enabled) }}
          ports:
            - containerPort: {{ .Values.detectors.tcpflowkiller.metrics.port }}
              protocol: TCP
          {{ end }}
          {{- with .Values.detectors.tcpflowkiller.resources }}
          resources:
            {{- . | toYaml | nindent 12 }}
          {{- end }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- . | toYaml | nindent 12 }}
          {{- end }}
          stdin: true
          tty: true
          volumeMounts:
            - mountPath: /sys
              name: sys
              readOnly: true
            - mountPath: /config
              name: config-tcpflowkiller
              readOnly: true
            {{- range $key, $value := .Values.detectors.tcpflowkiller.bannedIpv4ConfigMaps }}
            - mountPath: /ban-config/{{ $value }}
              name: flowkiller-{{ $key }}
              readOnly: true
              subPath: {{ $value }}
            {{- end }}
            {{- if or .Values.detectors.tcpflowkiller.containerdHostPath .Values.detectors.tcpflowkiller.dockerHostPath }}
            - mountPath: /host
              name: host-rootfs
              readOnly: true
            {{- end }}
        {{- end }}
        {{- if $collector_metrics_enabled }}
        - name: collector
          {{- with .Values.metrics.collector.image }}
          image: "{{ .repository }}:{{ .tag }}"
          {{- end }}
          {{- with .Values.metrics.collector.image.pullPolicy }}
          imagePullPolicy: {{ . }}
          {{- end }}
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- . | toYaml | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: {{ .Values.metrics.collector.port }}
              name: metrics
              protocol: TCP
          {{- with .Values.metrics.collector.resources }}
          resources:
            {{- . | toYaml | nindent 12 }}
          {{- end }}
          {{- with .Values.metrics.collector.containerSecurityContext }}
          securityContext:
            {{- . | toYaml | nindent 12 }}
          {{- end }}
          volumeMounts:
            - mountPath: /etc/otelcol-contrib
              name: config-collector
              readOnly: true
        {{- end }}
      hostPID: true
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- . | toYaml | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- . | toYaml | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- . | toYaml | nindent 8 }}
      {{- end }}
      volumes:
        {{- if .Values.detectors.execwhacker.enabled }}
        - configMap:
            defaultMode: 420
            name: {{ include "cryptnono.fullname" . }}-execwhacker
          name: config-execwhacker
        {{- end }}
        {{- if .Values.detectors.tcpflowkiller.enabled }}
        - configMap:
            defaultMode: 420
            name: {{ include "cryptnono.fullname" . }}-tcpflowkiller
          name: config-tcpflowkiller
        {{- end }}
        {{- if $collector_metrics_enabled }}
        - configMap:
            defaultMode: 420
            name: {{ include "cryptnono.fullname" . }}-collector
          name: config-collector
        {{- end }}
        {{- range $key, $value := .Values.detectors.tcpflowkiller.bannedIpv4ConfigMaps }}
        - configMap:
            defaultMode: 420
            name: {{ $key }}
            items:
              - key: {{ $value }}
                path: {{ $value }}
          name: flowkiller-{{ $key }}
        {{- end }}
        - hostPath:
            path: /sys
          name: sys
        {{- if or .Values.detectors.execwhacker.containerdHostPath .Values.detectors.execwhacker.dockerHostPath .Values.detectors.tcpflowkiller.containerdHostPath .Values.detectors.tcpflowkiller.dockerHostPath }}
        - hostPath:
            path: /
            type: Directory
          name: host-rootfs
        {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}